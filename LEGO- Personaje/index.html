<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lego Minifigure Pure CSS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="canvas">
    <div class="lego-figure">
      
      <!-- Cabeza y Espespárrago (Stud) -->
      <div class="head-container">
        <div class="head-stud"></div>
        <div class="head">
          <div class="brow left"></div>
          <div class="brow right"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="smile"></div>
        </div>
      </div>

      <!-- Cuello -->
      <div class="neck"></div>

      <!-- Torso y Brazos -->
      <div class="torso-container">
        <div class="torso">
          <div class="shirt-lines"></div>
        </div>

        <!-- Arm Left -->
        <div class="arm-wrapper left">
          <div class="arm"></div>
          <div class="hand"></div>
        </div>

        <!-- Arm Right -->
        <div class="arm-wrapper right">
          <div class="arm"></div>
          <div class="hand"></div>
        </div>
      </div>

      <!-- Cadera y Piernas -->
      <div class="hips-container">
        <div class="hips">
          <div class="hip-joint"></div>
        </div>
        <div class="legs">
          <div class="leg left">
            <div class="foot"></div>
          </div>
          <div class="leg right">
            <div class="foot"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
